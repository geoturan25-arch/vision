<div id="catalog-sections"></div>

<script>
  document.addEventListener("DOMContentLoaded", function() {
    const customProducts = JSON.parse(localStorage.getItem('vision_custom_products') || '[]');
    
    // Ищем куда вывести каталог на вашем сайте
    let container = document.getElementById('cards') || document.querySelector('.products-grid') || document.getElementById('catalog-sections');
    if (!container) return;
    
    container.innerHTML = '';
    if (customProducts.length === 0) {
      container.innerHTML = '<p style="text-align:center; color:#666; padding:20px;">Каталог пока пуст. Добавьте товары через панель управления.</p>';
      return;
    }

    // Словарь категорий для красоты
    const categoryNames = {
      'ip': '📷 IP-камеры',
      'analog': '📹 Аналоговые камеры',
      'nvr': '🎛️ Регистраторы (NVR / DVR)',
      'acc': '🔌 Аксессуары и PoE'
    };

    // Группируем товары по категориям
    const grouped = {};
    customProducts.forEach(p => {
      const cat = p.type || 'ip';
      if (!grouped[cat]) grouped[cat] = [];
      grouped[cat].push(p);
    });

    // Выводим каждую категорию отдельно
    for (const [catKey, items] of Object.entries(grouped)) {
      const section = document.createElement('div');
      section.style.cssText = 'margin-bottom: 40px;';
      
      section.innerHTML = `
        <h2 style="font-size: 22px; color: #1e293b; border-bottom: 2px solid #2563eb; padding-bottom: 8px; margin-bottom: 20px;">
          ${categoryNames[catKey] || '📦 Другое'}
        </h2>
        <div class="products-grid-custom" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px;"></div>
      `;

      const grid = section.querySelector('.products-grid-custom');

      items.forEach(p => {
        const card = document.createElement('div');
        card.style.cssText = 'background:#fff; border:1px solid #e2e8f0; border-radius:8px; padding:15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); display: flex; flex-direction: column; justify-content: space-between;';
        
        card.innerHTML = `
          <div>
            <img src="${p.image || 'https://via.placeholder.com/250'}" alt="${p.name}" style="width:100%; height:160px; object-fit:cover; border-radius:6px; background:#f1f5f9;">
            <div style="margin-top: 10px;">
              <span style="background:#e0f2fe; color:#0369a1; padding:2px 8px; font-size:11px; font-weight:bold; border-radius:4px;">${p.brand}</span>
            </div>
            <h3 style="margin: 8px 0 5px 0; font-size: 16px; color:#0f172a;">${p.name}</h3>
            <p style="font-size: 12px; color: #64748b; margin: 0 0 10px 0; line-height: 1.4;">${p.spec || ''}</p>
          </div>
          <div>
            <div style="font-weight: bold; font-size: 18px; color: #0f172a; margin-bottom: 10px;">${p.price} GEL</div>
            <a href="https://wa.me/995500000000?text=Здравствуйте!%20Хочу%20заказать%20${encodeURIComponent(p.brand + ' ' + p.name)}" target="_blank" style="background:#25d366; color:#fff; padding:8px 12px; border-radius:6px; text-decoration:none; display:block; text-align:center; font-weight:bold; font-size:14px;">Заказать в WhatsApp</a>
          </div>
        `;
        grid.appendChild(card);
      });

      container.appendChild(section);
    }
  });
</script>
